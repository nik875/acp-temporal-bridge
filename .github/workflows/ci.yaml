name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Temporal CLI (for the e2e dev server)
        uses: temporalio/setup-temporal-cli@v1
        with:
          version: latest

      - name: Lint
        run: uv run ruff check .

      - name: Test
        env:
          TEMPORAL_CLI_PATH: /usr/local/bin/temporal
        run: uv run pytest -q
