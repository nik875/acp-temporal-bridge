name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Temporal CLI (for the e2e dev server)
        # No published setup action exists (temporalio/setup-temporal-cli is
        # not a real repo); install the release binary directly. The binary
        # extracts as ./temporal-cli/temporal.
        run: |
          set -euo pipefail
          version=1.9.1
          curl -fsSL "https://github.com/temporalio/cli/releases/download/v${version}/temporal_cli_${version}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 temporal-cli_${version}_linux_amd64/temporal
          temporal --version

      - name: Lint
        run: uv run ruff check .

      - name: Test
        env:
          TEMPORAL_CLI_PATH: /usr/local/bin/temporal
        run: uv run pytest -q
