[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acp-temporal-bridge"
version = "0.1.18"
description = "Agent Client Protocol bridge for durable agent sessions on Temporal — one workflow per session, replayable, restart-safe."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Astra" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "temporalio>=1.34.0,<2",
    "temporalio-deepagents>=0.0.3,<0.1",
    "deepagents>=0.7,<0.8",
    "agent-client-protocol>=0.10.1,<0.11",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/acp_temporal_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
